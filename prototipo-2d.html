<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantinhas vs Slimes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@700;900&display=swap">
<style>
  /* Layout: a full-screen garden canvas, floating sticker-style HUD on top, a chunky tool tray at the bottom. */
  :root {
    --sky: #86cfff;
    --leaf: #5fb94f;
    --rose: #ff6fae;
    --rose-deep: #e04b8e;
    --plum: #5a2f7a;
    --cream: #fffaf2;
    --sun: #ffd23f;
    --zap: #fff36b;
    --font-display: "Sniglet", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  [hidden] { display: none !important; }
  body {
    background: var(--sky);
    color: var(--plum);
    font-family: var(--font-body);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

  .hud {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
  }
  .counters { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--cream); border-radius: 999px; padding: 4px 14px 4px 6px;
    box-shadow: 0 3px 0 rgba(90, 47, 122, .18);
    font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--plum);
    transition: transform .2s;
  }
  .pill canvas { width: 36px; height: 36px; }
  .pill.bump { animation: bump .45s ease; }
  @keyframes bump { 0% { transform: scale(1) } 35% { transform: scale(1.25) rotate(-4deg) } 100% { transform: scale(1) } }

  .round-btn {
    pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: var(--cream); color: var(--plum); box-shadow: 0 3px 0 rgba(90, 47, 122, .18);
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .round-btn svg { width: 26px; height: 26px; }
  .round-btn:focus-visible, .tool:focus-visible, .play:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 3px; }

  #toolbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; gap: 6px; padding: 8px;
    background: var(--cream); border-radius: 28px;
    box-shadow: 0 5px 0 rgba(90, 47, 122, .2), 0 10px 30px rgba(40, 90, 30, .18);
    max-width: calc(100vw - 24px);
  }
  .tool {
    width: min(70px, calc((100vw - 76px) / 6)); border: 0; border-radius: 20px; padding: 6px 2px 5px;
    background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-family: var(--font-display); font-size: 14px; color: var(--plum);
    transition: transform .15s, background .15s;
  }
  .tool canvas { width: 46px; height: 46px; max-width: 100%; }
  .tool:hover { background: #fdeef6; }
  .tool.active { background: #ffd8ea; transform: translateY(-6px); box-shadow: 0 4px 0 #f3a9cc; }
  .tool[data-tool="zap"].active { background: #efe2ff; box-shadow: 0 4px 0 #c7a8f3; }
  .tool.nudge { animation: nudge .6s ease; }
  .tool.suggest canvas { animation: suggest 1.4s ease-in-out infinite; }
  .tool.alert { animation: alert 1s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: translateY(0) } 25% { transform: translateY(-14px) rotate(-6deg) } 55% { transform: translateY(-4px) rotate(5deg) } }
  @keyframes suggest { 0%,100% { transform: scale(1) } 50% { transform: scale(1.14) } }
  @keyframes alert { 0%,100% { background: #efe2ff } 50% { background: #fff6a8 } }
  @media (max-width: 420px) { .tool { font-size: 12px } .tool canvas { width: 38px; height: 38px } .pill { font-size: 19px } .pill canvas { width: 30px; height: 30px } }

  #intro {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(255, 240, 248, .35); backdrop-filter: blur(2px);
  }
  .card {
    background: var(--cream); border-radius: 36px; padding: 28px 24px 24px; max-width: 460px; width: 100%;
    text-align: center; box-shadow: 0 8px 0 rgba(90, 47, 122, .2), 0 20px 50px rgba(90, 47, 122, .18);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: floaty 4s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .card h1 {
    margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 9vw, 52px); line-height: .95;
    color: var(--rose); text-wrap: balance; letter-spacing: .01em;
    text-shadow: 0 3px 0 var(--rose-deep), 0 6px 0 rgba(90, 47, 122, .15);
  }
  .card h1 span { color: #8bd35f; text-shadow: 0 3px 0 #4fa844, 0 6px 0 rgba(90, 47, 122, .15); }
  .card p { margin: 0; font-size: 17px; line-height: 1.4; max-width: 34ch; text-wrap: balance; }
  .steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 2px; align-items: center; }
  .steps canvas { width: 40px; height: 40px; }
  .steps .arrow { font-family: var(--font-display); color: #e7a3c4; font-size: 18px; }
  .play {
    border: 0; cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 28px;
    color: #fff; background: var(--rose); padding: 12px 44px 14px; border-radius: 999px;
    box-shadow: 0 6px 0 var(--rose-deep); transition: transform .1s, box-shadow .1s;
  }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--rose-deep); }
  .tiny { font-size: 13px; opacity: .7; }
  @media (prefers-reduced-motion: reduce) { .card, .tool.suggest canvas, .tool.alert { animation: none } }
</style>

<canvas id="game" aria-label="Jardim com canteiros. Toque num canteiro para cuidar dele e toque nos cubinhos para dar um raio neles."></canvas>

<div class="hud">
  <div class="counters">
    <div class="pill" id="pFlowers" title="Margaridas colhidas"><canvas width="72" height="72" data-icon="daisy"></canvas><span id="nFlowers">0</span></div>
    <div class="pill" id="pZapped" title="Cubinhos espantados"><canvas width="72" height="72" data-icon="cube"></canvas><span id="nZapped">0</span></div>
  </div>
  <button class="round-btn" id="soundBtn" aria-label="Desligar som" title="Som">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
      <path id="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
      <path id="mute" d="M16 9.5l5 5M21 9.5l-5 5" hidden/>
    </svg>
  </button>
</div>

<nav id="toolbar" aria-label="Ferramentas">
  <button class="tool active" data-tool="hoe" id="t-hoe"><canvas width="92" height="92" data-icon="hoe"></canvas><span>Arar</span></button>
  <button class="tool" data-tool="rake" id="t-rake"><canvas width="92" height="92" data-icon="rake"></canvas><span>Afofar</span></button>
  <button class="tool" data-tool="shovel" id="t-shovel"><canvas width="92" height="92" data-icon="shovel"></canvas><span>Furar</span></button>
  <button class="tool" data-tool="seeds" id="t-seeds"><canvas width="92" height="92" data-icon="seeds"></canvas><span>Semear</span></button>
  <button class="tool" data-tool="water" id="t-water"><canvas width="92" height="92" data-icon="water"></canvas><span>Regar</span></button>
  <button class="tool" data-tool="zap" id="t-zap"><canvas width="92" height="92" data-icon="zap"></canvas><span>Raio</span></button>
</nav>

<div id="intro">
  <div class="card">
    <h1>Plantinhas <span>vs</span> Slimes</h1>
    <p>Cuide do seu jardim de margaridas e espante os cubinhos alienígenas com raios de choquinho!</p>
    <div class="steps" aria-hidden="true">
      <canvas width="80" height="80" data-icon="hoe"></canvas><span class="arrow">›</span>
      <canvas width="80" height="80" data-icon="rake"></canvas><span class="arrow">›</span>
      <canvas width="80" height="80" data-icon="shovel"></canvas><span class="arrow">›</span>
      <canvas width="80" height="80" data-icon="seeds"></canvas><span class="arrow">›</span>
      <canvas width="80" height="80" data-icon="water"></canvas><span class="arrow">›</span>
      <canvas width="80" height="80" data-icon="daisy"></canvas>
    </div>
    <button class="play" id="playBtn">Jogar</button>
    <div class="tiny">Escolha a ferramenta e toque no canteiro</div>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOut = t => 1 - (1 - t) * (1 - t);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, DPR = 1, S = 100, horizon = 200, gridTop = 0, gridBottom = 0, gardenBottom = 0;
const ROWK = 0.8;
let T = 0;

const PETALS = ['#ffffff', '#ffffff', '#ffffff', '#ffd3e8', '#e8dcff', '#fff1a6'];
const ALIEN = {
  green: { main: '#7be36b', light: '#c2f7ae', dark: '#4fbf4a', spot: '#b77bf2', ant: '#c99bff' },
  purple: { main: '#b48cff', light: '#ddcbff', dark: '#8a5fe0', spot: '#8ced7c', ant: '#9cf08a' }
};
const NEXT = { grass: 'hoe', plowed: 'rake', fluffy: 'shovel', hole: 'seeds' };
const DUR = { hoe: 0.9, rake: 0.9, shovel: 0.7, seeds: 0.8, water: 1.1, pick: 0.55 };
const GROW = 6.5, DRY = 13, HOP = 0.75, BITE = 3.2;

/* ---------- shape helpers ---------- */
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(.1, r), 0, TAU); }
function starPath(c, x, y, r, n = 5, inner = .5, rot = 0) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n - Math.PI / 2, rad = i % 2 ? r * inner : r;
    i ? c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad) : c.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  c.closePath();
}
function heartPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .35);
  c.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45);
  c.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35);
  c.closePath();
}
function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }

/* ---------- reusable drawings (tools, daisy, cube) ---------- */
// Each tool is drawn with its grip at the origin, extending "up" (negative y).
function drawTool(c, type, sz) {
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  if (type === 'hoe') {
    c.strokeStyle = '#b07a4a'; c.lineWidth = sz * .075; line(c, 0, sz * .25, 0, -sz * .55);
    c.fillStyle = '#a9bdd0'; c.strokeStyle = '#7189a0'; c.lineWidth = sz * .025;
    c.beginPath(); c.moveTo(-sz * .04, -sz * .62); c.lineTo(sz * .26, -sz * .57); c.lineTo(sz * .31, -sz * .38);
    c.quadraticCurveTo(sz * .17, -sz * .43, sz * .01, -sz * .48); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff8fc8'; circ(c, 0, -sz * .55, sz * .045); c.fill();
  } else if (type === 'rake') {
    c.strokeStyle = '#b07a4a'; c.lineWidth = sz * .075; line(c, 0, sz * .25, 0, -sz * .5);
    const cx = 0, cy = -sz * .5, R = sz * .34;
    c.fillStyle = '#ff8fc8';
    c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, -Math.PI / 2 - .55, -Math.PI / 2 + .55); c.closePath(); c.fill();
    c.strokeStyle = '#e0579a'; c.lineWidth = sz * .03;
    for (let i = -2; i <= 2; i++) { const a = -Math.PI / 2 + i * .24; line(c, cx, cy, cx + Math.cos(a) * R * .97, cy + Math.sin(a) * R * .97); }
    c.fillStyle = '#e0579a'; circ(c, cx, cy, sz * .05); c.fill();
  } else if (type === 'shovel') {
    c.fillStyle = '#ff8fc8'; rr(c, -sz * .05, -sz * .12, sz * .1, sz * .3, sz * .05); c.fill();
    c.strokeStyle = '#8fa3b6'; c.lineWidth = sz * .04; line(c, 0, -sz * .12, 0, -sz * .22);
    c.fillStyle = '#b4c6d6';
    c.beginPath(); c.moveTo(0, -sz * .66);
    c.quadraticCurveTo(sz * .2, -sz * .52, sz * .15, -sz * .3); c.quadraticCurveTo(sz * .08, -sz * .2, 0, -sz * .2);
    c.quadraticCurveTo(-sz * .08, -sz * .2, -sz * .15, -sz * .3); c.quadraticCurveTo(-sz * .2, -sz * .52, 0, -sz * .66);
    c.fill();
    c.strokeStyle = '#8fa3b6'; c.lineWidth = sz * .02; line(c, 0, -sz * .58, 0, -sz * .26);
    c.fillStyle = 'rgba(255,255,255,.6)'; ell(c, -sz * .07, -sz * .45, sz * .025, sz * .07, .3); c.fill();
  } else if (type === 'seeds') {
    c.fillStyle = '#f0d39e'; rr(c, -sz * .16, sz * .02, sz * .34, sz * .36, sz * .12); c.fill();
    c.fillStyle = '#d9b679'; rr(c, -sz * .09, -sz * .05, sz * .2, sz * .1, sz * .04); c.fill();
    c.strokeStyle = '#e0579a'; c.lineWidth = sz * .03; line(c, -sz * .1, sz * .04, sz * .12, sz * .04);
    c.fillStyle = '#8a5a32';
    ell(c, -sz * .04, -sz * .07, sz * .025, sz * .035, .4); c.fill(); ell(c, sz * .04, -sz * .08, sz * .025, sz * .035, -.4); c.fill();
    drawDaisyHead(c, sz * .01, sz * .22, sz * .1, '#ffffff', false);
  } else if (type === 'water') {
    c.translate(-sz * .12, sz * .14);
    c.strokeStyle = '#6cc3f5'; c.lineWidth = sz * .055;
    c.beginPath(); c.arc(sz * .1, sz * .02, sz * .13, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
    c.lineWidth = sz * .07; line(c, sz * .3, sz * .24, sz * .5, sz * .03);
    c.fillStyle = '#4fb1ec'; ell(c, sz * .52, sz * .01, sz * .06, sz * .04, -.7); c.fill();
    c.fillStyle = '#86d3ff'; rr(c, -sz * .08, sz * .02, sz * .38, sz * .32, sz * .1); c.fill();
    c.fillStyle = '#b8e6ff'; rr(c, -sz * .08, sz * .02, sz * .38, sz * .08, sz * .04); c.fill();
    c.fillStyle = '#ff7eb6'; heartPath(c, sz * .11, sz * .21, sz * .085); c.fill();
  } else if (type === 'zap') {
    c.fillStyle = '#9b63e8'; c.save(); c.rotate(.18); rr(c, -sz * .05, -sz * .04, sz * .11, sz * .24, sz * .05); c.fill(); c.restore();
    c.fillStyle = '#7ee6c4'; c.beginPath(); c.moveTo(sz * .02, -sz * .14); c.lineTo(sz * .1, -sz * .27); c.lineTo(sz * .17, -sz * .14); c.closePath(); c.fill();
    c.fillStyle = '#c9a3ff'; ell(c, sz * .1, -sz * .07, sz * .17, sz * .1); c.fill();
    c.fillStyle = 'rgba(255,255,255,.55)'; ell(c, sz * .05, -sz * .11, sz * .08, sz * .03); c.fill();
    c.fillStyle = '#ff8fc8'; rr(c, sz * .2, -sz * .115, sz * .22, sz * .085, sz * .04); c.fill();
    c.strokeStyle = '#e0579a'; c.lineWidth = sz * .02; line(c, sz * .28, -sz * .11, sz * .28, -sz * .035); line(c, sz * .35, -sz * .11, sz * .35, -sz * .035);
    c.shadowColor = '#fff36b'; c.shadowBlur = sz * .15;
    c.fillStyle = '#fff36b'; circ(c, sz * .45, -sz * .072, sz * .06); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#fff'; circ(c, sz * .435, -sz * .085, sz * .02); c.fill();
  }
  c.restore();
}

function drawDaisyHead(c, x, y, r, petal, face = true, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = petal; c.strokeStyle = 'rgba(200,170,190,.55)'; c.lineWidth = Math.max(.5, r * .03);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    ell(c, Math.cos(a) * r * .6, Math.sin(a) * r * .6, r * .42, r * .16, a); c.fill(); c.stroke();
  }
  c.fillStyle = '#f2a81d'; circ(c, 0, r * .03, r * .4); c.fill();
  c.fillStyle = '#ffd23f'; circ(c, 0, 0, r * .37); c.fill();
  if (face) {
    c.strokeStyle = '#7a4a2a'; c.lineWidth = r * .055; c.lineCap = 'round';
    c.beginPath(); c.arc(-r * .13, -r * .02, r * .07, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.beginPath(); c.arc(r * .13, -r * .02, r * .07, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.beginPath(); c.arc(0, r * .07, r * .08, Math.PI * .15, Math.PI * .85); c.stroke();
    c.fillStyle = 'rgba(255,120,150,.55)'; ell(c, -r * .25, r * .1, r * .07, r * .045); c.fill(); ell(c, r * .25, r * .1, r * .07, r * .045); c.fill();
  }
  c.restore();
}

// Alien cube body with feet at the origin.
function drawCube(c, s, kind, o = {}) {
  const col = ALIEN[kind];
  const flick = o.zap > 0 && ((T * 30) | 0) % 2 === 0;
  const main = flick ? '#fffbd0' : col.main;
  // antenna
  const sw = Math.sin(T * 5 + (o.phase || 0)) * s * .06;
  c.strokeStyle = col.dark; c.lineWidth = s * .06; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -s * .98); c.quadraticCurveTo(sw * .5, -s * 1.15, sw, -s * 1.28); c.stroke();
  c.fillStyle = flick ? '#fff36b' : col.ant; circ(c, sw, -s * 1.3, s * .09); c.fill();
  c.fillStyle = 'rgba(255,255,255,.7)'; circ(c, sw - s * .03, -s * 1.33, s * .03); c.fill();
  // body
  rr(c, -s / 2, -s, s, s, s * .24); c.fillStyle = main; c.fill();
  c.save(); rr(c, -s / 2, -s, s, s, s * .24); c.clip();
  c.fillStyle = flick ? '#ffffff' : col.light; c.fillRect(-s / 2, -s, s, s * .26);
  c.fillStyle = col.dark; c.globalAlpha = .35; c.fillRect(s * .3, -s, s * .3, s); c.globalAlpha = 1;
  c.fillStyle = col.spot; circ(c, -s * .3, -s * .2, s * .09); c.fill(); circ(c, s * .28, -s * .32, s * .06); c.fill(); circ(c, -s * .12, -s * .08, s * .045); c.fill();
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.75)'; rr(c, -s * .38, -s * .9, s * .16, s * .08, s * .04); c.fill();
  // eyes
  const ey = -s * .56, ex = s * .17, look = (o.look || 0) * s * .03;
  if (o.zap > 0) {
    c.strokeStyle = '#3b2550'; c.lineWidth = s * .05;
    for (const sx of [-ex, ex]) { line(c, sx - s * .07, ey - s * .07, sx + s * .07, ey + s * .07); line(c, sx + s * .07, ey - s * .07, sx - s * .07, ey + s * .07); }
  } else if (o.blink) {
    c.strokeStyle = '#3b2550'; c.lineWidth = s * .045;
    for (const sx of [-ex, ex]) line(c, sx - s * .08, ey, sx + s * .08, ey);
  } else {
    for (const sx of [-ex, ex]) {
      c.fillStyle = '#fff'; ell(c, sx, ey, s * .12, s * .14); c.fill();
      c.fillStyle = '#2d1b3d'; ell(c, sx + look, ey + s * .02, s * .075, s * .09); c.fill();
      c.fillStyle = '#fff'; circ(c, sx + look - s * .025, ey - s * .02, s * .028); c.fill();
    }
  }
  // blush

    ctx.strokeStyle = SKIN; ctx.lineWidth = h * .048; line(ctx, lx, -h * .27, lx + s, -h * .04);
    ctx.fillStyle = '#9b63e8'; ell(ctx, lx + s + h * .018, -h * .025, h * .05, h * .03); ctx.fill();
  }
  // pigtails (behind)
  const hx = 0, hy = -h * .74, hr = h * .2, tb = walking ? Math.sin(wt * 9) * h * .015 : Math.sin(T * 2) * h * .005;
  ctx.fillStyle = HAIR;
  circ(ctx, hx - hr * 1.02, hy + hr * .2 + tb, hr * .42); ctx.fill();
  circ(ctx, hx + hr * .98, hy + hr * .2 - tb, hr * .42); ctx.fill();
  circ(ctx, hx, hy - hr * .02, hr * 1.06); ctx.fill();
  // back arm
  ctx.strokeStyle = SKIN; ctx.lineWidth = h * .042; line(ctx, -h * .07, -h * .5, -h * .13 - sw * .3, -h * .35);
  ctx.fillStyle = SKIN; circ(ctx, -h * .13 - sw * .3, -h * .35, h * .028); ctx.fill();
  // dress
  ctx.fillStyle = DRESS;
  ctx.beginPath(); ctx.moveTo(-h * .085, -h * .555); ctx.lineTo(h * .085, -h * .555);
  ctx.quadraticCurveTo(h * .13, -h * .4, h * .2, -h * .26); ctx.quadraticCurveTo(0, -h * .2, -h * .2, -h * .26);
  ctx.quadraticCurveTo(-h * .13, -h * .4, -h * .085, -h * .555); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = h * .022;
  ctx.beginPath(); ctx.moveTo(-h * .18, -h * .275); ctx.quadraticCurveTo(0, -h * .225, h * .18, -h * .275); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const [dx, dy] of [[-.08, -.36], [.05, -.42], [.1, -.32], [-.02, -.3], [-.03, -.47]]) { circ(ctx, dx * h, dy * h, h * .014); ctx.fill(); }
  ctx.fillStyle = '#fff'; ell(ctx, -h * .035, -h * .54, h * .045, h * .022, .3); ctx.fill(); ell(ctx, h * .035, -h * .54, h * .045, h * .022, -.3); ctx.fill();
  // head
  ctx.fillStyle = SKIN; circ(ctx, hx, hy, hr); ctx.fill();
  ctx.save(); circ(ctx, hx, hy, hr * 1.06); ctx.clip();
  ctx.fillStyle = HAIR;
  circ(ctx, hx - hr * .5, hy - hr * .72, hr * .6); ctx.fill();
  circ(ctx, hx + hr * .15, hy - hr * .82, hr * .62); ctx.fill();
  circ(ctx, hx + hr * .72, hy - hr * .58, hr * .42); ctx.fill();
  circ(ctx, hx - hr * .95, hy - hr * .1, hr * .4); ctx.fill();
  ctx.restore();
  // bows on pigtails
  for (const [bx, by] of [[hx - hr * .9, hy - hr * .18 + tb], [hx + hr * .86, hy - hr * .18 - tb]]) {
    ctx.fillStyle = '#ff5fa2';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - hr * .3, by - hr * .2); ctx.lineTo(bx - hr * .3, by + hr * .2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + hr * .3, by - hr * .2); ctx.lineTo(bx + hr * .3, by + hr * .2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff9ac8'; circ(ctx, bx, by, hr * .1); ctx.fill();
  }
  drawDaisyHead(ctx, hx - hr * .45, hy - hr * .72, hr * .26, '#ffffff', false);
  // face (3/4 view, looking forward)
  const blink = girl.blink < 0;
  const ex1 = hx + hr * .02, ex2 = hx + hr * .52, ey = hy + hr * .12;
  if (blink) {
    ctx.strokeStyle = '#3b2550'; ctx.lineWidth = h * .012;
    ctx.beginPath(); ctx.arc(ex1, ey, hr * .1, Math.PI * .15, Math.PI * .85); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex2, ey, hr * .1, Math.PI * .15, Math.PI * .85); ctx.stroke();
  } else {
    for (const ex of [ex1, ex2]) {
      ctx.fillStyle = '#3b2550'; ell(ctx, ex, ey, hr * .1, hr * .14); ctx.fill();
      ctx.fillStyle = '#fff'; circ(ctx, ex + hr * .03, ey - hr * .05, hr * .04); ctx.fill();
      circ(ctx, ex - hr * .03, ey + hr * .05, hr * .02); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(255,120,150,.5)'; ell(ctx, hx - hr * .2, hy + hr * .42, hr * .14, hr * .08); ctx.fill(); ell(ctx, hx + hr * .78, hy + hr * .4, hr * .12, hr * .08); ctx.fill();
  ctx.strokeStyle = '#a0405f'; ctx.lineWidth = h * .012;
  if (girl.happy > 0 || zapping) {
    ctx.fillStyle = '#c4466e'; ctx.beginPath(); ctx.arc(hx + hr * .3, hy + hr * .4, hr * .13, 0, Math.PI); ctx.closePath(); ctx.fill();
  } else { ctx.beginPath(); ctx.arc(hx + hr * .3, hy + hr * .36, hr * .12, Math.PI * .2, Math.PI * .8); ctx.stroke(); }
  // front arm + tool
  const a = girl.action;
  let hxp = h * .16, hyp = -h * .36, ang = -.25, held = tool === 'zap' ? 'zap' : tool;
  if (zapping) {
    held = 'zap';
    const lx = (girl.aimX - x) * f, ly = girl.aimY - (y - h * .45);
    const aim = clamp(Math.atan2(ly, Math.max(1, lx)), -1.1, 1.1);
    hxp = h * .07 + Math.cos(aim) * h * .17; hyp = -h * .48 + Math.sin(aim) * h * .17; ang = aim;
  } else if (a) {
    const k = a.t / a.dur; held = a.tool;
    if (a.tool === 'hoe' || a.tool === 'rake') { const s = Math.abs(Math.sin(k * TAU)); ang = -.4 + s * 1.7; hyp = -h * .42 + s * h * .1; hxp = h * .17; }
    else if (a.tool === 'shovel') { ang = .5 + Math.sin(k * Math.PI * 3) * .5; hxp = h * .22; hyp = -h * .32; }
    else if (a.tool === 'seeds') { hyp = -h * .42 + Math.sin(k * Math.PI * 4) * h * .03; hxp = h * .19; ang = Math.sin(k * Math.PI * 4) * .2; }
    else if (a.tool === 'water') { ang = Math.min(1, k * 4) * .75; hxp = h * .2; hyp = -h * .44; }
    else if (a.tool === 'pick') { held = null; hxp = h * .27; hyp = -h * .32 - Math.sin(k * Math.PI) * h * .08; }
  } else if (held === 'seeds') { hyp = -h * .4; ang = 0; }
  else if (held === 'water') { ang = 0; hyp = -h * .4; }
  else if (held === 'zap') { ang = .5; hxp = h * .15; hyp = -h * .34; }
  ctx.strokeStyle = SKIN; ctx.lineWidth = h * .044; line(ctx, h * .065, -h * .5, hxp, hyp);
  if (held) { ctx.save(); ctx.translate(hxp, hyp); ctx.rotate(ang); drawTool(ctx, held, h * .5); ctx.restore(); }
  ctx.fillStyle = SKIN; circ(ctx, hxp, hyp, h * .03); ctx.fill();
  ctx.restore();
}

function drawAlien(a) {
  const s = a.size, jit = a.zap > 0 ? rand(-1, 1) * s * .06 : 0;
  ctx.save(); ctx.translate(a.x + jit, a.y);
  ctx.fillStyle = 'rgba(40,90,30,.22)'; ell(ctx, 0, 0, s * .55 * (1 - a.air / S * 1.5), s * .13); ctx.fill();
  ctx.translate(0, -a.air);
  const sq = clamp(a.sq, -.15, .25);
  ctx.scale(a.face * (1 + sq), 1 - sq);
  drawCube(ctx, s, a.kind, { zap: a.zap, blink: a.blink < 0, phase: a.phase, look: 1, munch: a.target && a.munch > 0 ? a.munch : undefined });
  ctx.restore();
  if (a.zap > 0) {
    ctx.save(); ctx.strokeStyle = '#fff36b'; ctx.lineWidth = Math.max(2, s * .05); ctx.lineJoin = 'round'; ctx.shadowColor = '#fff36b'; ctx.shadowBlur = 10;
    for (let i = 0; i < 3; i++) {
      const cx = a.x, cy = a.y - a.air - s * .5, ang = rand(0, TAU), r1 = s * .5, r2 = s * .95;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
      for (let k = 1; k <= 3; k++) { const rk = lerp(r1, r2, k / 3); ctx.lineTo(cx + Math.cos(ang + rand(-.3, .3)) * rk, cy + Math.sin(ang + rand(-.3, .3)) * rk); }
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBolt(b) {
  const r = b.r;
  const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 2.8);
  glow.addColorStop(0, 'rgba(255,255,220,1)'); glow.addColorStop(.3, 'rgba(255,243,107,.9)'); glow.addColorStop(1, 'rgba(160,245,255,0)');
  ctx.fillStyle = glow; circ(ctx, b.x, b.y, r * 2.8); ctx.fill();
  ctx.strokeStyle = '#9ff5ff'; ctx.lineWidth = Math.max(1.5, r * .22); ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const a0 = T * 14 + i * TAU / 3;
    ctx.beginPath();
    for (let k = 0; k <= 4; k++) { const a = a0 + k * .35, rk = r * (1.2 + (k % 2) * .5); k ? ctx.lineTo(b.x + Math.cos(a) * rk, b.y + Math.sin(a) * rk) : ctx.moveTo(b.x + Math.cos(a) * rk, b.y + Math.sin(a) * rk); }
    ctx.stroke();
  }
  ctx.fillStyle = '#ffffff'; circ(ctx, b.x, b.y, r * .6); ctx.fill();
}

function drawParticle(p) {
  const k = clamp(p.life / p.max, 0, 1);
  ctx.globalAlpha = p.t === 'dirt' || p.t === 'seed' ? 1 : Math.min(1, k * 2);
  switch (p.t) {
    case 'dirt': case 'crumb': ctx.fillStyle = p.color; circ(ctx, p.x, p.y, p.size); ctx.fill(); break;
    case 'seed': ctx.fillStyle = p.color; ell(ctx, p.x, p.y, p.size * 1.3, p.size, p.rot); ctx.fill(); break;
    case 'drop': ctx.fillStyle = p.color; ell(ctx, p.x, p.y, p.size * .8, p.size * 1.3); ctx.fill(); break;
    case 'spark': ctx.fillStyle = p.color; starPath(ctx, p.x, p.y, p.size * (.6 + k), 4, .35); ctx.fill(); break;
    case 'star': ctx.fillStyle = p.color; starPath(ctx, p.x, p.y, p.size * 1.3, 5, .5, p.rot); ctx.fill(); break;
    case 'heart': ctx.fillStyle = p.color; heartPath(ctx, p.x, p.y, p.size * 1.2); ctx.fill(); break;
    case 'cube': ctx.fillStyle = p.color; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); rr(ctx, -p.size, -p.size, p.size * 2, p.size * 2, p.size * .4); ctx.fill(); ctx.restore(); break;
    case 'petal': ctx.fillStyle = p.color; ell(ctx, p.x, p.y, p.size * 1.4, p.size * .6, p.rot); ctx.fill(); ctx.strokeStyle = 'rgba(200,170,190,.5)'; ctx.lineWidth = 1; ctx.stroke(); break;
    case 'puff': ctx.fillStyle = p.color; circ(ctx, p.x, p.y, p.size * (1.6 - k * .6)); ctx.fill(); break;
    case 'ring': ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(2, S * .025 * k); circ(ctx, p.x, p.y, p.size * (1 - k * .8)); ctx.stroke(); break;
    case 'fly': ctx.globalAlpha = 1; drawDaisyHead(ctx, p.x, p.y, p.size * (.6 + .4 * k), p.color, true, (1 - k) * 6); break;
  }
  ctx.globalAlpha = 1;
}

function drawButterfly(b) {
  const flap = .2 + .8 * Math.abs(Math.sin(b.ph));
  const s = Math.max(7, S * .07);
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rest > 0 ? 0 : Math.cos(b.a) * .25);
  ctx.fillStyle = b.c;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.scale(side * flap, 1);
    ell(ctx, s * .55, -s * .3, s * .55, s * .45, .4); ctx.fill();
    ell(ctx, s * .4, s * .35, s * .35, s * .3, -.4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; circ(ctx, s * .6, -s * .35, s * .15); ctx.fill(); ctx.fillStyle = b.c;
    ctx.restore();
  }
  ctx.fillStyle = '#5a2f7a'; ell(ctx, 0, 0, s * .1, s * .45); ctx.fill();
  ctx.strokeStyle = '#5a2f7a'; ctx.lineWidth = 1.2;
  line(ctx, 0, -s * .4, -s * .2, -s * .75); line(ctx, 0, -s * .4, s * .2, -s * .75);
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  for (const p of plots) drawPatch(p);
  if (started && tool !== 'zap') for (const p of plots) if (neededTool(p) === tool) drawHint(p);
  const list = [];
  for (const p of plots) if (p.state === 'plant') list.push([p.y, 0, p]);
  list.push([girl.y, 1, girl]);
  for (const a of aliens) list.push([a.y, 2, a]);
  list.sort((a, b) => a[0] - b[0]);
  for (const [, k, o] of list) k === 0 ? drawPlant(o) : k === 1 ? drawGirl() : drawAlien(o);
  for (const p of plots) drawOverlays(p);
  for (const b of bolts) drawBolt(b);
  for (const p of parts) drawParticle(p);
  for (const b of butterflies) drawButterfly(b);
}

/* ---------- input ---------- */
function plotAt(x, y) {
  let best = null, bd = 1e9;
  for (const p of plots) {
    const dx = x - p.x, dy = y - p.y;
    if (Math.abs(dx) < S * .5 && dy > -S * (p.state === 'plant' ? .75 : .35) && dy < S * .35) {
      const d = Math.hypot(dx, Math.max(0, dy) + Math.min(0, dy) * .4);
      if (d < bd) { bd = d; best = p; }
    }
  }
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (!started) return;
  ensureAudio();
  const x = e.clientX, y = e.clientY;
  let best = null, bd = 1e9;
  for (const a of aliens) {
    if (a.dying) continue;
    const d = Math.hypot(x - a.x, y - (a.y - a.air - a.size * .55));
    if (d < a.size + 14 && d < bd) { bd = d; best = a; }
  }
  if (best) { setTool('zap'); shoot(best.x, best.y - best.air - best.size * .5, best); return; }
  if (tool === 'zap') { shoot(x, y, null); return; }
  const p = plotAt(x, y);
  if (!p) { ring(x, y, 'rgba(255,255,255,.8)', .5); return; }
  const need = neededTool(p);
  if (need === 'pick') { queueJob(p, 'pick'); return; }
  if (need === tool) queueJob(p, tool);
  else { p.wob = .7; nudge(need); sfx('nope'); }
});
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  updateToolHints();
}
function nudge(t) {
  const b = document.getElementById('t-' + t); if (!b) return;
  b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge');
}
function bumpHud(id) { const el = document.getElementById(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function setText() { document.getElementById('nFlowers').textContent = flowers; document.getElementById('nZapped').textContent = zapped; }
let lastSuggest = null, lastAlert = null;
function updateToolHints() {
  let sug = null;
  if (tool !== 'zap' && !plots.some(p => neededTool(p) === tool)) {
    const thirsty = plots.find(p => p.state === 'plant' && p.stage < 4 && p.water <= 0);
    const other = plots.find(p => neededTool(p) !== 'pick' && neededTool(p) !== 'water');
    sug = thirsty ? 'water' : other ? neededTool(other) : null;
  }
  if (sug !== lastSuggest) { document.querySelectorAll('.tool').forEach(b => b.classList.toggle('suggest', b.dataset.tool === sug)); lastSuggest = sug; }
  const alert = aliens.some(a => !a.dying) && tool !== 'zap';
  if (alert !== lastAlert) { document.getElementById('t-zap').classList.toggle('alert', alert); lastAlert = alert; }
}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => { ensureAudio(); setTool(b.dataset.tool); }));
window.addEventListener('keydown', e => {
  const i = '123456'.indexOf(e.key);
  if (i >= 0 && started) setTool(['hoe', 'rake', 'shovel', 'seeds', 'water', 'zap'][i]);
});
const soundBtn = document.getElementById('soundBtn');
function setMuted(m) {
  muted = m;
  if (outBus) outBus.gain.value = m ? 0 : 1;
  document.getElementById('waves').hidden = m; document.getElementById('mute').hidden = !m;
  soundBtn.setAttribute('aria-label', m ? 'Ligar som' : 'Desligar som');
  save();
}
soundBtn.addEventListener('click', () => { ensureAudio(); setMuted(!muted); });
document.getElementById('playBtn').addEventListener('click', () => {
  ensureAudio(); started = true; document.getElementById('intro').hidden = true; save();
});

/* ---------- saving ---------- */
function snapshot() {
  return { flowers, zapped, muted, started, tool, plots: plots.map(p => ({ state: p.state, stage: p.stage, g: p.g, water: p.water, color: p.color })) };
}
function restore(d) {
  if (!d || !Array.isArray(d.plots)) return false;
  flowers = d.flowers | 0; zapped = d.zapped | 0;
  d.plots.slice(0, 12).forEach((s, i) => Object.assign(plots[i], { state: s.state || 'grass', stage: s.stage | 0, g: +s.g || 0, water: +s.water || 0, color: s.color || '#ffffff' }));
  if (d.muted) setMuted(true);
  if (d.tool) setTool(d.tool);
  return true;
}
function save() { try { localStorage.setItem('plantinhas-vs-slimes', JSON.stringify(snapshot())); } catch (e) { } }
window.claude?.hot?.snapshot?.(() => snapshot());
addEventListener('pagehide', save);

/* ---------- boot ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function start(data) {
  let restored = false;
  if (data && data.plots) restored = restore(data);
  if (!restored) { try { restore(JSON.parse(localStorage.getItem('plantinhas-vs-slimes') || 'null')); } catch (e) { } }
  if (data && data.started) { started = true; document.getElementById('intro').hidden = true; }
  setText(); paintIcons(); layout(); updateToolHints();
  addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
